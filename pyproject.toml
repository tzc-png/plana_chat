[project]
name = "plana_chat"
version = "0.1.0"
description = "普拉娜 Telegram 二次元角色语音聊天机器人"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["plana_chat", "plana_chat.llm", "plana_chat.tts"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
